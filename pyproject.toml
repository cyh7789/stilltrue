[project]
name = "stilltrue"
version = "0.1.0"
description = "Finds DataHub context that has drifted out of sync with reality, proposes fixes with citations, and writes verdicts back to the graph."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["acryl-datahub", "datahub-agent-context", "typer", "PyYAML"]

[project.scripts]
stilltrue = "stilltrue.cli:app"

[build-system]
# >=77 because `license`/`license-files` above are PEP 639, which older
# setuptools rejects outright -- and `pip install -e .` is the first line of the
# README, so breaking it breaks the first thing anyone runs.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
